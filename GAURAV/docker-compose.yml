version: '3.8'

services:
  mongodb:
    image: mongo:latest
    container_name: rai_mongodb
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  server:
    build: ./server
    container_name: rai_backend_server
    restart: always
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - MONGODB_URI=mongodb://mongodb:27017/rai_financial
      - JWT_SECRET=super_secret_jwt_key_rai_financial_2026_dsa
      - JWT_EXPIRE=24h
      - NODE_ENV=production
      - CLIENT_URL=http://localhost:80
    depends_on:
      - mongodb

  client:
    build: ./client
    container_name: rai_frontend_client
    restart: always
    ports:
      - "80:80"
    depends_on:
      - server

volumes:
  mongo_data:
